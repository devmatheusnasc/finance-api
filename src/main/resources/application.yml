spring:
  application:
    name: finance-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    generate-ddl: false
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  sql:
    init:
      mode: never

  lifecycle:
    timeout-per-shutdown-phase: 20s

finance:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

    authentication:
      rate-limit-key-secret: ${AUTH_RATE_LIMIT_HASH_SECRET}

      session-duration: ${AUTH_SESSION_DURATION:PT30M}
      session-idle-timeout: ${AUTH_SESSION_IDLE_TIMEOUT:PT15M}
      session-activity-update-interval: ${AUTH_SESSION_ACTIVITY_UPDATE_INTERVAL:PT5M}

      credential-max-failures: ${AUTH_CREDENTIAL_MAX_FAILURES:5}
      credential-lock-duration: ${AUTH_CREDENTIAL_LOCK_DURATION:PT15M}

      account-rate-limit:
        max-failures: ${AUTH_ACCOUNT_RATE_MAX_FAILURES:5}
        window: ${AUTH_ACCOUNT_RATE_WINDOW:PT15M}
        block-duration: ${AUTH_ACCOUNT_RATE_BLOCK_DURATION:PT15M}

      source-rate-limit:
        max-failures: ${AUTH_SOURCE_RATE_MAX_FAILURES:25}
        window: ${AUTH_SOURCE_RATE_WINDOW:PT15M}
        block-duration: ${AUTH_SOURCE_RATE_BLOCK_DURATION:PT15M}

      registration-rate-limit:
        max-attempts: ${AUTH_REGISTRATION_RATE_MAX_ATTEMPTS:5}
        window: ${AUTH_REGISTRATION_RATE_WINDOW:PT1H}
        block-duration: ${AUTH_REGISTRATION_RATE_BLOCK_DURATION:PT1H}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health

  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-components: never
      show-details: never

      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    br.com.finance: INFO