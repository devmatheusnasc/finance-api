name: finance-api-local

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - finance_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - finance_network

  api:
    build:
      context: .

    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: local

      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}

      SERVER_PORT: ${SERVER_PORT:-8080}

      AUTH_RATE_LIMIT_HASH_SECRET: ${AUTH_RATE_LIMIT_HASH_SECRET}

      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC}

    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"

    stop_grace_period: 25s

    networks:
      - finance_network


volumes:
  finance_postgres_data:

networks:
  finance_network:
    driver: bridge